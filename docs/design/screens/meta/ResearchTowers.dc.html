<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&amp;family=Oxanium:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#0a0e17}
a{color:#c6ff3d}a:hover{color:#eaf0fa}
*{box-sizing:border-box}
.d{font-family:"Oxanium","Chakra Petch",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.u{font-family:"Barlow Semi Condensed","Barlow",system-ui,sans-serif}
.lbl{font-family:"Barlow Semi Condensed","Barlow",system-ui,sans-serif;font-size:13px;line-height:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.c2s{clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.c2m{clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.c2l{clip-path:polygon(16px 0,100% 0,100% 100%,0 100%,0 16px)}
.hatch{background-color:#111726;background-image:repeating-linear-gradient(135deg,rgba(111,124,150,.3) 0 2px,transparent 2px 9px)}
button{font:inherit;cursor:pointer;border:0;padding:0;color:inherit;background:none}
button:disabled{cursor:not-allowed}
button:focus-visible,a:focus-visible{outline:2px solid #c6ff3d;outline-offset:3px}
</style>
</helmet>
<div class="u" style="width:390px;height:844px;position:relative;overflow:hidden;background:#0a0e17;color:#eaf0fa;display:flex;flex-direction:column">
  <div style="flex:1;display:flex;flex-direction:column;gap:16px;padding:56px 16px 16px">
    <!-- Header -->
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
      <div style="display:flex;flex-direction:column">
        <h1 class="d" style="margin:0;font-size:28px;line-height:32px;font-weight:700;letter-spacing:.04em;text-transform:uppercase">Research Lab</h1>
        <span style="font-size:14px;line-height:18px;color:#a3afc6">Permanent. Kept between runs.</span>
      </div>
      <div class="c2s" style="display:flex;align-items:center;gap:6px;height:40px;padding:0 12px 0 10px;background:#111726">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="fill:none;stroke:#b48cff;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 4px rgba(180,140,255,.45))"><path d="M12 2.5l8.5 4.9v9.2L12 21.5l-8.5-4.9V7.4z"></path><path d="M12 12v9.5M12 12l8.5-4.6M12 12L3.5 7.4"></path></svg>
        <span class="d" style="font-size:20px;line-height:24px;font-weight:700">12,480</span>
      </div>
    </div>

    <!-- Tower picker -->
    <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:8px">
      <button aria-pressed="true" class="c2s" style="height:56px;background:#c6ff3d;padding:3px">
        <span class="c2s" style="display:flex;align-items:center;gap:8px;height:100%;padding:0 8px;background:#1a2236">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="flex:none;fill:#06080d;stroke:#ff4fd8;stroke-width:2.5;stroke-linejoin:round;filter:drop-shadow(0 0 4px rgba(255,79,216,.5))"><path d="M12 2.5l9.5 9.5-9.5 9.5L2.5 12z"></path></svg>
          <span style="font-size:16px;line-height:18px;font-weight:700;text-align:left">Pulse Laser</span>
        </span>
      </button>
      <button class="c2s" style="height:56px;background:#5d6e94;padding:2px">
        <span class="c2s" style="display:flex;align-items:center;gap:8px;height:100%;padding:0 8px;background:#1a2236">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="flex:none;fill:#06080d;stroke:#ff7a33;stroke-width:2.5"><rect x="3.5" y="3.5" width="17" height="17"></rect></svg>
          <span style="font-size:16px;line-height:18px;font-weight:700;text-align:left">Mass Driver</span>
        </span>
      </button>
      <button class="c2s" style="height:56px;background:#5d6e94;padding:2px">
        <span class="c2s" style="display:flex;align-items:center;gap:8px;height:100%;padding:0 8px;background:#1a2236">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="flex:none;fill:#06080d;stroke:#8ff3ff;stroke-width:2.5;stroke-linejoin:round"><path d="M12 2.5l8.5 4.8v9.4L12 21.5l-8.5-4.8V7.3z"></path></svg>
          <span style="font-size:16px;line-height:18px;font-weight:700;text-align:left">Frost Coil</span>
        </span>
      </button>
      <button disabled="" class="c2s" style="height:56px;background:#2a3550;padding:2px">
        <span class="c2s hatch" style="display:flex;align-items:center;gap:8px;height:100%;padding:0 8px;color:#6f7c96">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="flex:none;fill:none;stroke:#6f7c96;stroke-width:2;stroke-linejoin:round"><rect x="5" y="11" width="14" height="10"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
          <span style="display:flex;flex-direction:column;align-items:flex-start"><span class="lbl">Tower 4</span><span style="font-size:14px;line-height:18px">In Unlocks</span></span>
        </span>
      </button>
      <button disabled="" class="c2s" style="height:56px;background:#2a3550;padding:2px">
        <span class="c2s hatch" style="display:flex;align-items:center;gap:8px;height:100%;padding:0 8px;color:#6f7c96">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="flex:none;fill:none;stroke:#6f7c96;stroke-width:2;stroke-linejoin:round"><rect x="5" y="11" width="14" height="10"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
          <span style="display:flex;flex-direction:column;align-items:flex-start"><span class="lbl">Tower 5</span><span style="font-size:14px;line-height:18px">In Unlocks</span></span>
        </span>
      </button>
      <button disabled="" class="c2s" style="height:56px;background:#2a3550;padding:2px">
        <span class="c2s hatch" style="display:flex;align-items:center;gap:8px;height:100%;padding:0 8px;color:#6f7c96">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="flex:none;fill:none;stroke:#6f7c96;stroke-width:2;stroke-linejoin:round"><rect x="5" y="11" width="14" height="10"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
          <span style="display:flex;flex-direction:column;align-items:flex-start"><span class="lbl">Tower 6</span><span style="font-size:14px;line-height:18px">In Unlocks</span></span>
        </span>
      </button>
    </div>

    <!-- Tracks -->
    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:baseline;justify-content:space-between">
        <span class="lbl" style="color:#a3afc6">Pulse Laser tracks</span>
        <span style="display:flex;align-items:center;gap:4px">
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" style="fill:none;stroke:#ff4fd8;stroke-width:2;stroke-linejoin:round"><path d="M12 3l9 9-9 9-9-9z"></path></svg>
          <span class="lbl" style="color:#ff4fd8">Energy</span>
        </span>
      </div>

      <!-- Damage: affordable -->
      <div class="c2m" style="display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;background:#1a2236">
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
          <div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px">
            <span style="font-size:19px;line-height:24px;font-weight:700">Damage</span>
            <span class="d" style="font-size:15px;line-height:18px;font-weight:600;color:#a3afc6">LV 12 / 30</span>
          </div>
          <span style="display:block;height:4px;background:#2a3550"><span style="display:block;width:40%;height:4px;background:#eaf0fa"></span></span>
          <span style="font-size:14px;line-height:18px;color:#a3afc6">+48% → <span style="color:#eaf0fa">+52%</span></span>
        </div>
        <button aria-label="Upgrade damage for 1,200 Cores" class="c2s" style="flex:none;width:112px;height:48px;background:#5d6e94;padding:2px">

          </span>
        </button>

      <!-- Fire rate: affordable -->
      <div class="c2m" style="display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;background:#1a2236">

            <span style="font-size:19px;line-height:24px;font-weight:700">Fire rate</span>
            <span class="d" style="font-size:15px;line-height:18px;font-weight:600;color:#a3afc6">LV 8 / 30</span>
          </div>
          <span style="display:block;height:4px;background:#2a3550"><span style="display:block;width:27%;height:4px;background:#eaf0fa"></span></span>
          <span style="font-size:14px;line-height:18px;color:#a3afc6">+16% → <span style="color:#eaf0fa">+18%</span></span>
        </div>
        <button aria-label="Upgrade fire rate for 2,400 Cores" class="c2s" style="flex:none;width:112px;height:48px;background:#5d6e94;padding:2px">
          <span class="c2s" style="display:flex;align-items:center;justify-content:center;gap:6px;height:100%;background:#111726">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="fill:none;stroke:#b48cff;stroke-width:2;stroke-linejoin:round"><path d="M12 2.5l8.5 4.9v9.2L12 21.5l-8.5-4.9V7.4z"></path><path d="M12 12v9.5M12 12l8.5-4.6M12 12L3.5 7.4"></path></svg>
            <span class="d" style="font-size:15px;line-height:18px;font-weight:700">2,400</span>
          </span>
        </button>
      </div>

      <!-- Range: maxed -->
      <div class="c2m" style="display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;background:#1a2236">
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
          <div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px">
            <span style="font-size:19px;line-height:24px;font-weight:700">Range</span>
            <span class="d" style="font-size:15px;line-height:18px;font-weight:600;color:#a3afc6">LV 20 / 20</span>
          </div>
          <span style="display:block;height:4px;background:#c6ff3d"></span>
          <span style="font-size:14px;line-height:18px;color:#a3afc6">+40% range</span>
        </div>
        <div style="flex:none;width:112px;height:48px;display:flex;align-items:center;justify-content:center;gap:6px">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill:none;stroke:#c6ff3d;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><circle cx="12" cy="12" r="9"></circle><path d="M8 12.5l3 3 5-6"></path></svg>
          <span style="font-size:16px;font-weight:700;letter-spacing:.06em">MAX</span>
        </div>
      </div>

      <!-- Starting level: not affordable -->
      <div class="c2m" style="display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;background:#1a2236">
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
          <div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px">
            <span style="font-size:19px;line-height:24px;font-weight:700">Starting level</span>
            <span class="d" style="font-size:15px;line-height:18px;font-weight:600;color:#a3afc6">LV 2 / 4</span>
          </div>
          <span style="display:block;height:4px;background:#2a3550"><span style="display:block;width:50%;height:4px;background:#eaf0fa"></span></span>
          <span style="font-size:14px;line-height:18px;color:#a3afc6">Placed at Lv 3 → <span style="color:#eaf0fa">Lv 4</span></span>
        </div>
        <div style="flex:none;width:112px;display:flex;flex-direction:column;align-items:center;gap:2px">
          <button disabled="" aria-label="Starting level costs 18,000 Cores, need 5,520 more" class="c2s" style="width:112px;height:48px;background:#2a3550;padding:2px">
            <span class="c2s hatch" style="display:flex;align-items:center;justify-content:center;gap:6px;height:100%;color:#6f7c96">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="fill:none;stroke:#6f7c96;stroke-width:2;stroke-linejoin:round"><path d="M12 2.5l8.5 4.9v9.2L12 21.5l-8.5-4.9V7.4z"></path><path d="M12 12v9.5M12 12l8.5-4.6M12 12L3.5 7.4"></path></svg>

          <span style="font-size:14px;line-height:18px;color:#a3afc6">Need 5,520</span>

  <!-- Bottom bar: back + tabs -->

    <div style="display:flex;gap:8px;align-items:stretch">
      <a href="Main.dc.html" aria-label="Back to menu" class="c2s" style="flex:none;display:block;width:48px;height:48px;background:#5d6e94;padding:2px">

        </span>

      <div role="tablist" style="flex:1;display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:4px">

        <a href="ResearchBase.dc.html" role="tab" aria-selected="false" style="display:flex;align-items:center;justify-content:center;gap:6px;height:48px;color:#a3afc6;text-decoration:none;font-size:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase">Base<span class="d c2s" style="padding:0 5px;background:#c6ff3d;color:#06080d;font-size:13px;line-height:16px">1</span></a>
        <a href="ResearchUnlocks.dc.html" role="tab" aria-selected="false" style="display:flex;align-items:center;justify-content:center;gap:6px;height:48px;color:#a3afc6;text-decoration:none;font-size:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase">Unlocks<span class="d c2s" style="padding:0 5px;background:#c6ff3d;color:#06080d;font-size:13px;line-height:16px">1</span></a>

  </div>
</div>
