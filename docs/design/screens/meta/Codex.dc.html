<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Artifact Codex</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&amp;family=Oxanium:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#0a0e17}
a{color:#c6ff3d}a:hover{color:#eaf0fa}
*{box-sizing:border-box}
.d{font-family:"Oxanium","Chakra Petch",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.u{font-family:"Barlow Semi Condensed","Barlow",system-ui,sans-serif}
.lbl{font-family:"Barlow Semi Condensed","Barlow",system-ui,sans-serif;font-size:13px;line-height:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.c2s{clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.c1m{clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
.c2m{clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.c4m{clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px)}
.c2l{clip-path:polygon(16px 0,100% 0,100% 100%,0 100%,0 16px)}
.pip{display:inline-block;width:8px;height:8px;border-radius:2px}
.hatch{background-color:#111726;background-image:repeating-linear-gradient(135deg,rgba(111,124,150,.3) 0 2px,transparent 2px 9px)}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:104px;padding:8px;text-align:center;background:#1a2236}
button{font:inherit;cursor:pointer;border:0;padding:0;color:inherit;background:none}
button:focus-visible,a:focus-visible{outline:2px solid #c6ff3d;outline-offset:3px}
</style>
</helmet>
<div class="u" style="width:390px;height:844px;position:relative;overflow:hidden;background:#0a0e17;color:#eaf0fa;display:flex;flex-direction:column">
  <div style="flex:1;display:flex;flex-direction:column;gap:12px;padding:56px 16px 12px">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
      <div style="display:flex;flex-direction:column">
        <h1 class="d" style="margin:0;font-size:28px;line-height:32px;font-weight:700;letter-spacing:.04em;text-transform:uppercase">Artifact Codex</h1>
        <span style="font-size:14px;line-height:18px;color:#a3afc6"><span class="d" style="color:#eaf0fa;font-weight:600">14 / 32</span> crafted · in your draw pool</span>
      </div>
      <div class="c2s" style="display:flex;align-items:center;gap:6px;height:40px;padding:0 12px 0 10px;background:#111726">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="fill:none;stroke:#5cf2c8;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 4px rgba(92,242,200,.45))"><path d="M12 2l6 8-6 12-6-12z"></path><path d="M6 10h12M10 10l2-8 2 8"></path></svg>
        <span class="d" style="font-size:20px;line-height:24px;font-weight:700">86</span>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:8px">
      <!-- Common -->
      <button style="display:block;background:#a3afc6;padding:2px">
        <span class="tile">
          <svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true" style="fill:#06080d;stroke:#a3afc6;stroke-width:2"><rect x="3" y="3" width="26" height="26"></rect><path d="M17 9l-4 7h6l-4 7" style="fill:none;stroke:#eaf0fa;stroke-linecap:round;stroke-linejoin:round"></path></svg>
          <span style="font-size:16px;line-height:18px;font-weight:700">Capacitor Bank</span>
          <span style="display:flex;gap:4px"><span class="pip" style="background:#a3afc6"></span></span>
        </span>
      </button>
      <!-- Rare, selected -->
      <div style="outline:3px solid #c6ff3d;outline-offset:3px">
        <div style="filter:drop-shadow(0 0 4px rgba(79,168,255,.35)) drop-shadow(0 0 8px rgba(79,168,255,.12))">
          <button aria-pressed="true" class="c1m" style="display:block;width:100%;background:#4fa8ff;padding:2px">
            <span class="tile c1m">
              <svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true" style="fill:#06080d;stroke:#4fa8ff;stroke-width:2;stroke-linejoin:round"><path d="M3 3h19l7 7v19H3z"></path><circle cx="16" cy="17" r="6" style="stroke:#eaf0fa"></circle><path d="M16 14v6" style="stroke:#eaf0fa"></path></svg>
              <span style="font-size:16px;line-height:18px;font-weight:700">Bounty Ledger</span>
              <span style="display:flex;gap:4px"><span class="pip" style="background:#4fa8ff"></span><span class="pip" style="background:#4fa8ff"></span></span>
            </span>
          </button>
        </div>
      </div>
      <!-- Legendary -->
      <div style="filter:drop-shadow(0 0 8px rgba(255,179,61,.35)) drop-shadow(0 0 16px rgba(255,179,61,.12))">
        <button class="c4m" style="display:block;width:100%;background:#ffb33d;padding:2px">
          <span class="c4m" style="display:block;background:#0a0e17;padding:2px">
            <span class="c4m" style="display:block;background:#ffb33d;padding:1px">
              <span class="tile c4m" style="height:94px">
                <svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true" style="fill:#06080d;stroke:#ffb33d;stroke-width:2;stroke-linejoin:round"><path d="M9 2h14l7 7v14l-7 7H9l-7-7V9z"></path><circle cx="16" cy="16" r="6" style="stroke:#eaf0fa"></circle></svg>
                <span style="font-size:16px;line-height:18px;font-weight:700">Last Stand Protocol</span>
                <span style="display:flex;gap:4px"><span class="pip" style="background:#ffb33d"></span><span class="pip" style="background:#ffb33d"></span><span class="pip" style="background:#ffb33d"></span><span class="pip" style="background:#ffb33d"></span></span>
              </span>
            </span>
          </span>
        </button>
      </div>
      <!-- Epic -->
      <div style="filter:drop-shadow(0 0 8px rgba(192,107,255,.35)) drop-shadow(0 0 16px rgba(192,107,255,.12))">
        <button class="c2m" style="display:block;width:100%;background:#c06bff;padding:2px">
          <span class="tile c2m">
            <svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true" style="fill:#06080d;stroke:#c06bff;stroke-width:2;stroke-linejoin:round"><path d="M9 3h20v20l-6 6H3V9z"></path><path d="M16 11l5 3v6l-5 3-5-3v-6z" style="stroke:#eaf0fa"></path></svg>
            <span style="font-size:16px;line-height:18px;font-weight:700">Cryo Lattice</span>
            <span style="display:flex;gap:4px"><span class="pip" style="background:#c06bff"></span><span class="pip" style="background:#c06bff"></span><span class="pip" style="background:#c06bff"></span></span>
          </span>
        </button>
      </div>
      <!-- Not crafted -->
      <button class="c2s" style="display:block;background:#2a3550;padding:2px">
        <span class="tile hatch c2s" style="background-color:#111726">
          <svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true" style="fill:none;stroke:#6f7c96;stroke-width:2;stroke-dasharray:4 3"><rect x="3" y="3" width="26" height="26"></rect></svg>
          <span style="font-size:16px;line-height:18px;font-weight:700;color:#a3afc6">Shield Breaker</span>
          <span class="lbl" style="color:#a3afc6">Not crafted</span>
        </span>
      </button>
      <!-- Rare -->
      <div style="filter:drop-shadow(0 0 4px rgba(79,168,255,.35)) drop-shadow(0 0 8px rgba(79,168,255,.12))">
        <button class="c1m" style="display:block;width:100%;background:#4fa8ff;padding:2px">
          <span class="tile c1m">
            <svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true" style="fill:#06080d;stroke:#4fa8ff;stroke-width:2;stroke-linejoin:round"><path d="M3 3h19l7 7v19H3z"></path><path d="M10 16h12M16 10v12" style="stroke:#eaf0fa"></path></svg>
            <span style="font-size:16px;line-height:18px;font-weight:700">Kinetic Primer</span>
            <span style="display:flex;gap:4px"><span class="pip" style="background:#4fa8ff"></span><span class="pip" style="background:#4fa8ff"></span></span>
          </span>
        </button>
      </div>
      <!-- Not crafted -->
      <button class="c2s" style="display:block;background:#2a3550;padding:2px">
        <span class="tile hatch c2s" style="background-color:#111726">
          <svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true" style="fill:none;stroke:#6f7c96;stroke-width:2;stroke-dasharray:4 3"><rect x="3" y="3" width="26" height="26"></rect></svg>
          <span style="font-size:16px;line-height:18px;font-weight:700;color:#a3afc6">Overflow Coil</span>
          <span class="lbl" style="color:#a3afc6">Not crafted</span>
        </span>
      </button>
      <!-- Common -->
      <button style="display:block;background:#a3afc6;padding:2px">
        <span class="tile">
          <svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true" style="fill:#06080d;stroke:#a3afc6;stroke-width:2"><rect x="3" y="3" width="26" height="26"></rect><circle cx="16" cy="16" r="3" style="stroke:#eaf0fa"></circle><circle cx="16" cy="16" r="8" style="stroke:#eaf0fa"></circle></svg>
          <span style="font-size:16px;line-height:18px;font-weight:700">Echo Chamber</span>
          <span style="display:flex;gap:4px"><span class="pip" style="background:#a3afc6"></span></span>
        </span>
      </button>
      <!-- Not crafted -->
      <button class="c2s" style="display:block;background:#2a3550;padding:2px">
        <span class="tile hatch c2s" style="background-color:#111726">
          <svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true" style="fill:none;stroke:#6f7c96;stroke-width:2;stroke-dasharray:4 3"><rect x="3" y="3" width="26" height="26"></rect></svg>
          <span style="font-size:16px;line-height:18px;font-weight:700;color:#a3afc6">Null Anchor</span>
          <span class="lbl" style="color:#a3afc6">Not crafted</span>
        </span>
      </button>
    </div>
  </div>

  <!-- Detail sheet -->
  <div class="c2l" style="display:flex;flex-direction:column;gap:12px;background:#111726;padding:16px 16px 34px;border-top:1px solid #2a3550">
    <div style="display:flex;align-items:center;gap:12px">
      <svg viewBox="0 0 48 48" width="48" height="48" aria-hidden="true" style="flex:none;fill:#06080d;stroke:#4fa8ff;stroke-width:2.5;stroke-linejoin:round;filter:drop-shadow(0 0 4px rgba(79,168,255,.45))"><path d="M3 3h32l10 10v32H3z"></path><circle cx="24" cy="25" r="9" style="stroke:#eaf0fa;stroke-width:2"></circle><path d="M24 20v10" style="stroke:#eaf0fa;stroke-width:2"></path></svg>
      <div style="flex:1;display:flex;flex-direction:column">
        <span style="font-size:19px;line-height:24px;font-weight:700">Bounty Ledger</span>
        <span style="display:flex;align-items:center;gap:6px;font-size:14px;line-height:18px;color:#a3afc6">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="fill:none;stroke:#c6ff3d;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><circle cx="12" cy="12" r="9"></circle><path d="M8 12.5l3 3 5-6"></path></svg>
          Crafted · in draw pool
        </span>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <div class="c2s" style="display:flex;flex-direction:column;gap:2px;padding:8px 12px;background:#1a2236">
        <span style="display:flex;align-items:center;gap:4px">
          <span class="lbl" style="color:#a3afc6;margin-right:4px">Now</span>
          <span class="pip" style="background:#4fa8ff"></span><span class="pip" style="background:#4fa8ff"></span>
          <span class="lbl" style="color:#4fa8ff;margin-left:4px">Rare</span>
        </span>
        <span style="font-size:16px;line-height:22px;font-weight:500">+15% Credits from every kill.</span>
      </div>
      <div class="c2s" style="background:#c06bff;padding:2px">
        <div class="c2s" style="display:flex;flex-direction:column;gap:2px;padding:6px 10px;background:#1a2236">
          <span style="display:flex;align-items:center;gap:4px">
            <span class="lbl" style="color:#a3afc6;margin-right:4px">Next</span>
            <span class="pip" style="background:#c06bff"></span><span class="pip" style="background:#c06bff"></span><span class="pip" style="background:#c06bff"></span>
            <span class="lbl" style="color:#c06bff;margin-left:4px">Epic</span>
          </span>
          <span style="font-size:16px;line-height:22px;font-weight:500">+25% Credits from every kill. Boss kills pay double.</span>
        </div>
      </div>
    </div>

    <div style="display:flex;gap:8px">
      <a href="Main.dc.html" aria-label="Back to menu" class="c2m" style="flex:none;display:block;width:56px;height:56px;background:#5d6e94;padding:2px">
        <span class="c2m" style="display:flex;width:100%;height:100%;align-items:center;justify-content:center;background:#1a2236">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill:none;stroke:#eaf0fa;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M15 5l-7 7 7 7"></path></svg>
        </span>
      </a>
      <div style="flex:1;filter:drop-shadow(0 0 8px rgba(198,255,61,.35)) drop-shadow(0 0 16px rgba(198,255,61,.12))">
        <button class="c2m" style="width:100%;height:56px;background:#c6ff3d;color:#06080d;display:flex;align-items:center;justify-content:center;gap:10px;font-size:18px;line-height:20px;font-weight:700;letter-spacing:.06em;text-transform:uppercase">
          Upgrade to Epic
          <span style="display:flex;align-items:center;gap:4px">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="fill:none;stroke:#06080d;stroke-width:2.5;stroke-linejoin:round"><path d="M12 2l6 8-6 12-6-12z"></path><path d="M6 10h12"></path></svg>
            <span class="d">40</span>
          </span>
        </button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
