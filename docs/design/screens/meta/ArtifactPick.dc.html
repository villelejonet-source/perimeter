<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Artifact pick</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&amp;family=Oxanium:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#06080d}
a{color:#c6ff3d}a:hover{color:#eaf0fa}
*{box-sizing:border-box}
.d{font-family:"Oxanium","Chakra Petch",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.u{font-family:"Barlow Semi Condensed","Barlow",system-ui,sans-serif}
.lbl{font-family:"Barlow Semi Condensed","Barlow",system-ui,sans-serif;font-size:13px;line-height:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.c2s{clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.c2m{clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.c4m{clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px)}
.pip{display:inline-block;width:8px;height:8px;border-radius:2px}
.field{background-color:#06080d;background-image:repeating-linear-gradient(0deg,#141b2b 0 1px,transparent 1px 39px),repeating-linear-gradient(90deg,#141b2b 0 1px,transparent 1px 39px)}
button{font:inherit;cursor:pointer;border:0;padding:0;color:inherit;background:none}
button:focus-visible{outline:2px solid #c6ff3d;outline-offset:3px}
</style>
</helmet>
<div class="u field" style="width:390px;height:844px;position:relative;overflow:hidden;color:#eaf0fa">
  <svg viewBox="0 0 390 844" width="390" height="844" aria-hidden="true" style="position:absolute;inset:0;fill:none">
    <path d="M-10 260H200V520H90V700H400" style="stroke:#2a3550;stroke-width:36"></path>
    <path d="M150 210l14 14-14 14-14-14z" style="stroke:#ff4fd8;stroke-width:3;fill:#06080d"></path>
    <rect x="236" y="560" width="24" height="24" style="stroke:#ff7a33;stroke-width:3;fill:#06080d"></rect>
    <circle cx="200" cy="520" r="40" style="stroke:#eaf0fa;stroke-width:2;stroke-dasharray:6 6;opacity:.6"></circle>
  </svg>
  <div style="position:absolute;inset:0;background:rgba(10,14,23,.86)"></div>

  <div style="position:relative;height:100%;display:flex;flex-direction:column;padding:56px 16px 34px;gap:16px">
    <!-- Header -->
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center">
      <span class="c2s" style="display:flex;align-items:center;gap:6px;padding:6px 12px;background:#111726">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="fill:none;stroke:#c6ff3d;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><circle cx="12" cy="12" r="9"></circle><path d="M8 12.5l3 3 5-6"></path></svg>
        <span class="lbl" style="color:#eaf0fa">Boss down · Wave 30</span>
      </span>
      <h1 class="d" style="margin:0;font-size:28px;line-height:32px;font-weight:700;letter-spacing:.04em;text-transform:uppercase">Choose an artifact</h1>
      <span style="font-size:14px;line-height:18px;color:#a3afc6">Active for the rest of this run · Artifact 3 of run</span>
    </div>

    <div style="flex:1;display:flex;flex-direction:column;gap:14px;justify-content:center">

      <!-- Common: square frame, 1 pip, no glow -->
      <button style="display:block;text-align:left;background:#a3afc6;padding:2px">
        <span style="display:grid;grid-template-columns:56px minmax(0, 1fr);gap:12px;padding:12px;background:#1a2236">
          <svg viewBox="0 0 56 56" width="56" height="56" aria-hidden="true" style="fill:#06080d;stroke:#a3afc6;stroke-width:2;stroke-linejoin:round;stroke-linecap:round"><rect x="3" y="3" width="50" height="50"></rect><path d="M20 18h16v24H20zM24 14h8" style="stroke:#eaf0fa"></path><path d="M29 22l-4 8h6l-4 8" style="fill:none;stroke:#eaf0fa"></path></svg>
          <span style="display:flex;flex-direction:column;gap:4px">
            <span style="font-size:19px;line-height:24px;font-weight:700">Capacitor Bank</span>
            <span style="display:flex;align-items:center;gap:4px">
              <span class="pip" style="background:#a3afc6"></span>
              <span class="lbl" style="color:#a3afc6;margin-left:4px">Common</span>
            </span>
            <span style="font-size:16px;line-height:22px;font-weight:500">+10% Energy damage for all towers.</span>
          </span>
        </span>
      </button>

      <!-- Epic: 2 cut corners, 3 pips, glow-md — selected -->
      <div style="position:relative;outline:3px solid #c6ff3d;outline-offset:4px">
        <div style="filter:drop-shadow(0 0 8px rgba(192,107,255,.35)) drop-shadow(0 0 16px rgba(192,107,255,.12))">
          <button aria-pressed="true" class="c2m" style="display:block;width:100%;text-align:left;background:#c06bff;padding:2px">
            <span class="c2m" style="display:grid;grid-template-columns:56px minmax(0, 1fr);gap:12px;padding:12px;background:#1a2236">
              <svg viewBox="0 0 56 56" width="56" height="56" aria-hidden="true" style="fill:#06080d;stroke:#c06bff;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round"><path d="M13 3h40v40L43 53H3V13z"></path><path d="M28 14l10 6v12l-10 6-10-6V20z" style="stroke:#eaf0fa;stroke-width:2"></path><path d="M28 18v16M21 22l14 8M21 30l14-8" style="fill:none;stroke:#eaf0fa;stroke-width:2"></path></svg>
              <span style="display:flex;flex-direction:column;gap:4px">
                <span style="font-size:19px;line-height:24px;font-weight:700">Cryo Lattice</span>
                <span style="display:flex;align-items:center;gap:4px">
                  <span class="pip" style="background:#c06bff"></span><span class="pip" style="background:#c06bff"></span><span class="pip" style="background:#c06bff"></span>
                  <span class="lbl" style="color:#c06bff;margin-left:4px">Epic</span>
                </span>
                <span style="font-size:16px;line-height:22px;font-weight:500">Slowed enemies take +25% damage from every source.</span>
              </span>
            </span>
          </button>
        </div>
        <span style="position:absolute;top:-14px;right:-10px;width:28px;height:28px;border-radius:50%;background:#c6ff3d;display:flex;align-items:center;justify-content:center">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="fill:none;stroke:#06080d;stroke-width:3;stroke-linecap:round;stroke-linejoin:round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
        </span>
      </div>

      <!-- Legendary: 4 cut corners + double frame, 4 pips, glow-lg -->
      <div style="filter:drop-shadow(0 0 16px rgba(255,179,61,.35)) drop-shadow(0 0 32px rgba(255,179,61,.12))">
        <button class="c4m" style="display:block;width:100%;text-align:left;background:#ffb33d;padding:2px">
          <span class="c4m" style="display:block;background:#0a0e17;padding:2px">
            <span class="c4m" style="display:block;background:#ffb33d;padding:1px">
              <span class="c4m" style="display:grid;grid-template-columns:56px minmax(0, 1fr);gap:12px;padding:12px;background:#1a2236">
                <svg viewBox="0 0 56 56" width="56" height="56" aria-hidden="true" style="fill:#06080d;stroke:#ffb33d;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round"><path d="M13 3h30l10 10v30L43 53H13L3 43V13z"></path><circle cx="28" cy="28" r="13" style="stroke:#eaf0fa;stroke-width:2"></circle><path d="M28 10v8M28 38v8M10 28h8M38 28h8" style="stroke:#eaf0fa;stroke-width:2"></path></svg>
                <span style="display:flex;flex-direction:column;gap:4px">
                  <span style="font-size:19px;line-height:24px;font-weight:700">Last Stand Protocol</span>
                  <span style="display:flex;align-items:center;gap:4px">
                    <span class="pip" style="background:#ffb33d"></span><span class="pip" style="background:#ffb33d"></span><span class="pip" style="background:#ffb33d"></span><span class="pip" style="background:#ffb33d"></span>
                    <span class="lbl" style="color:#ffb33d;margin-left:4px">Legendary</span>
                  </span>
                  <span style="font-size:16px;line-height:22px;font-weight:500">Below 25% base HP, every tower fires 50% faster.</span>
                </span>
              </span>
            </span>
          </span>
        </button>
      </div>

      <div style="display:flex;align-items:center;justify-content:center;gap:6px;color:#a3afc6">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="fill:none;stroke:#a3afc6;stroke-width:2;stroke-linejoin:round"><rect x="5" y="11" width="14" height="10"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
        <span style="font-size:14px;line-height:18px">4th choice · unlock in Research Lab</span>
      </div>
    </div>

    <!-- Thumb zone actions -->
    <div style="display:flex;gap:8px;align-items:flex-start">
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px;width:132px">
        <button class="c2m" style="width:132px;height:56px;background:#5d6e94;padding:2px">
          <span class="c2m" style="display:flex;width:100%;height:100%;align-items:center;justify-content:center;gap:8px;background:#1a2236">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="fill:none;stroke:#eaf0fa;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M20 12a8 8 0 1 1-2.3-5.6"></path><path d="M20 4v5h-5"></path></svg>
            <span style="display:flex;flex-direction:column;align-items:flex-start">
              <span style="font-size:16px;line-height:18px;font-weight:700;letter-spacing:.06em;text-transform:uppercase">Reroll</span>
              <span style="display:flex;align-items:center;gap:4px">
                <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" style="fill:none;stroke:#ffd84d;stroke-width:2.5;stroke-linecap:round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v10"></path></svg>
                <span class="d" style="font-size:15px;line-height:18px;font-weight:700">150</span>
              </span>
            </span>
          </span>
        </button>
        <span style="font-size:14px;line-height:18px;color:#a3afc6">Next reroll <span class="d" style="font-weight:600;color:#eaf0fa">300</span></span>
      </div>
      <div style="flex:1;filter:drop-shadow(0 0 8px rgba(198,255,61,.35)) drop-shadow(0 0 16px rgba(198,255,61,.12))">
        <button class="c2m" style="width:100%;height:56px;background:#c6ff3d;color:#06080d;font-size:18px;line-height:20px;font-weight:700;letter-spacing:.06em;text-transform:uppercase">Take Cryo Lattice</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
