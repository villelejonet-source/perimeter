class Component extends DCLogic {
  renderVals() {
    const base = this.props.baseState ?? 'healthy';
    return {
      showBuffer: this.props.showBuffer ?? false,
      showFx: this.props.showFx ?? true,
      elite: this.props.elite ?? false,
      boss: this.props.boss ?? false,

    };

}
